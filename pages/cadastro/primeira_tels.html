<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08068d">
  <title>Bem-vindo | Bulbe</title>
  <link rel="stylesheet" href="cadastro.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <a class="pular" href="#conteudo">Ir ao conteúdo</a>
  <div class="aparelho">
  <main class="app app--acesso" id="conteudo">
        <!-- Barra de status visual para a prévia do aplicativo. -->
        <div class="barra-status" aria-label="Barra de status ilustrativa">
            <span class="horario-status">9:41</span>
            <div class="status-direita">
                <span class="sinal-status" role="img" aria-label="Sinal de celular completo"><i></i><i></i><i></i><i></i></span>
                <span class="rede-status">4G</span>
                <span class="bateria-status" role="img" aria-label="Bateria em 80%"><span></span></span>
            </div>
        </div>
    <div class="abertura">
      <img class="padrao padrao--superior" src="assets/img/padrao-superior.svg" alt="">
      <img class="padrao padrao--inferior" src="assets/img/padrao-inferior.svg" alt="">
      <div class="marca" role="img" aria-label="Bulbe, sua próxima energia">
        <img class="marca__simbolo" src="assets/img/marca.svg" alt="">
        <img class="marca__assinatura" src="assets/img/assinatura.svg" alt="">
      </div>
    </div>
    <section class="boas-vindas" aria-labelledby="titulo">
      <div class="introducao">
        <h1 id="titulo">Bem vindo!</h1>
        <p class="subtitulo">Entre para acessar a área do cliente Bulbe</p>
      </div>
      <div class="pilha">
        <a class="botao" href="template_cadastro.html?fluxo=entrar">Entrar</a>
        <a class="botao botao--secundario" href="template_cadastro.html?fluxo=primeiro-acesso">Primeiro acesso</a>
      </div>
      <div class="convite">
        <p>Não é um cliente Bulbe?</p>
        <a href="template_cadastro.html?fluxo=cadastro">Quero economizar</a>
      </div>
    </section>
  </main>
  </div>
</body>
</html>
