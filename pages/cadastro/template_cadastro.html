<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08068d">
    <title>Bulbe | Template de cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="mobile.css">
    <script src="cadastro.js" defer></script>
</head>
<body>
    <a class="pular" href="#conteudo">Ir ao conteúdo</a>

    <div class="aparelho">
        <div class="app acesso-email">
        <!-- Barra de status visual para a prévia do aplicativo. -->
        <div class="barra-status" aria-label="Barra de status ilustrativa">
            <span class="horario-status">9:41</span>
            <div class="status-direita">
                <span class="sinal-status" role="img" aria-label="Sinal de celular completo"><i></i><i></i><i></i><i></i></span>
                <span class="rede-status">4G</span>
                <span class="bateria-status" role="img" aria-label="Bateria em 80%"><span></span></span>
            </div>
        </div>

            <header class="cabecalho-acesso">
                <a class="voltar-acesso" href="../../index.html" aria-label="Voltar ao início">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m9 4-6 6 6 6M3 10h10a7 7 0 0 1 7 7v5"/>
                    </svg>
                </a>
                <div class="logo-acesso">
                    <img src="assets/img/logo-azul.svg" alt="Bulbe">
                </div>
            </header>

            <main class="conteudo-acesso" id="conteudo" tabindex="-1">
                <!-- Adicionar aqui o conteúdo de cada tela de cadastro. -->
            </main>
        </div>
    </div>
</body>
</html>
